  <style>
    :root{--garden:#f7f8ef;--leaf:#5b8c51;--sun:#ffcf45;--soil:#835c45}
    body{background:var(--garden)}
    .garden-hero{max-width:1170px;margin:auto;padding:78px 34px 66px;text-align:center}
    .garden-kicker{font-size:10px;letter-spacing:.2em;font-weight:800;color:#78946b}
    .garden-hero h1{font:800 clamp(42px,7vw,76px)/1.06 var(--display);letter-spacing:-.06em;color:#1c3e39;margin:18px 0}
    .garden-hero h1 span{color:#d59125}
    .garden-lead{max-width:540px;margin:0 auto;color:#718078;font-size:15px;line-height:1.8}
    .garden-cards{max-width:920px;margin:30px auto 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px}
    .garden-card{position:relative;min-height:455px;overflow:hidden;border:1px solid #e7eadb;border-radius:26px;background:linear-gradient(180deg,#fffef8,#f1f5e9);box-shadow:0 18px 45px #425a3310;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:16px 18px 28px;transition:transform .25s,box-shadow .25s}
    .garden-card:hover{transform:translateY(-7px);box-shadow:0 24px 50px #425a3325}
    .garden-card::before{content:"";position:absolute;width:270px;height:270px;border-radius:50%;top:46px;background:#f8e7a94d}
    .plant{width:245px;height:345px;position:absolute;top:12px;z-index:1}
    .plant .stem{stroke:#56834a;stroke-width:13;stroke-linecap:round;fill:none}
    .plant .leaf{fill:#75a95e;stroke:#477544;stroke-width:3}
    .plant .petal{fill:#ffca3a;stroke:#f2a91f;stroke-width:2}
    .plant .center{fill:#63442f;stroke:#3d2d24;stroke-width:5}
    .plant-alt .petal{fill:#f5ad34;stroke:#dc8224}
    .plant-alt .center{fill:#523929}
    .pot{position:relative;z-index:2;width:178px;height:130px;margin-bottom:2px;clip-path:polygon(4% 0,96% 0,82% 100%,18% 100%);background:linear-gradient(105deg,#d28a55,#b96942 55%,#a95439);display:grid;place-items:center;padding-top:16px;filter:drop-shadow(0 10px 6px #533c2925)}
    .pot-label{font:800 24px var(--display);letter-spacing:.02em;color:#fff8e7;text-shadow:0 2px 4px #603d2b55}
    .garden-card small{position:relative;z-index:2;margin-top:15px;color:#718078;font-size:11px;letter-spacing:.11em;font-weight:700}
    .garden-card .card-hint{position:absolute;right:18px;top:18px;z-index:3;width:32px;height:32px;border-radius:50%;background:#fff;color:#65815c;display:grid;place-items:center}
    .work-section{max-width:1170px;margin:30px auto 0;padding:66px 34px 90px;scroll-margin-top:28px}
    .work-section:nth-of-type(even){background:#fff;border-radius:28px}
    .work-section-head{display:flex;align-items:end;justify-content:space-between;gap:25px;margin-bottom:28px}
    .work-section-head .eyebrow{color:#78946b;font-size:10px;letter-spacing:.16em;font-weight:800}
    .work-section-head h2{font:800 clamp(30px,4vw,44px)/1.1 var(--display);letter-spacing:-.05em;color:#1c3e39;margin:10px 0 0}
    .work-section-head p{max-width:380px;color:#718078;font-size:13px;line-height:1.7;margin:0 0 4px}
    .poster-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
    .poster-card{background:#fff;border:1px solid #e7eadf;border-radius:14px;overflow:hidden;box-shadow:0 10px 25px #3247330c;transition:transform .2s,box-shadow .2s}
    .poster-card:hover{transform:translateY(-5px);box-shadow:0 18px 34px #3247331e}
    .poster-card a{display:block;background:#edf0e6}
    .poster-card img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
    .poster-card h3{font:700 13px/1.4 var(--display);color:#1c3e39;margin:13px 12px 5px}
    .poster-card p{font-size:11px;color:#7d897c;margin:0 12px 15px}
    .video-panel{min-height:220px;padding:32px;border-radius:18px;background:linear-gradient(135deg,#e5f0dc,#fff4d5);display:flex;align-items:center;gap:22px}
    .video-icon{flex:none;width:62px;height:62px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#d59125;font-size:25px;box-shadow:0 8px 20px #354e2c14}
    .video-panel h3{font:700 20px var(--display);color:#1c3e39;margin:0 0 8px}
    .video-panel p{font-size:13px;line-height:1.7;color:#718078;margin:0;max-width:570px}
    .back-top{display:inline-block;margin-top:22px;color:#557650;font-size:12px;font-weight:700}
    @media(max-width:900px){.poster-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.garden-cards{max-width:760px}}
    @media(max-width:600px){.garden-hero{padding:55px 20px 40px}.garden-cards{gap:12px}.garden-card{min-height:345px;padding-left:8px;padding-right:8px;border-radius:18px}.plant{width:180px;height:270px;top:8px}.garden-card::before{width:190px;height:190px;top:35px}.pot{width:142px;height:105px}.pot-label{font-size:19px}.garden-card small{font-size:9px;letter-spacing:.06em}.garden-card .card-hint{right:10px;top:10px;width:27px;height:27px}.work-section{padding:48px 20px 60px;margin-top:12px}.work-section-head{display:block}.work-section-head p{margin-top:10px}.poster-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.video-panel{align-items:flex-start;padding:22px 18px}.video-icon{width:48px;height:48px}.video-panel h3{font-size:17px}}
  </style>
</head>
